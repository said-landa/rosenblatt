<body data-theme="dark" data-screen="courses">
<main id="app">

  <header class="topbar">

    <span id="breadcrumb">Cursos</span>

  <nav id="course-carousel" aria-label="Cursos" hidden><button id="carousel-mouse" aria-current="true"><span class="carousel-art"><svg viewBox="0 0 64 80" aria-hidden="true"><rect x="12" y="12" width="40" height="60" rx="20"/><path d="M32 12v23M12 38h40M32 2v10"/><rect x="29" y="20" width="6" height="12" rx="3"/></svg></span><span>Mouse</span></button></nav>
  <nav id="bottom-nav" aria-label="Navegación principal">
    <button data-section="home"><svg viewBox="0 0 24 24"><path d="m3 10 9-8 9 8v12h-6v-8H9v8H3z"/></svg><span>Home</span></button>
    <button data-section="courses"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="14" height="17" rx="3"/><path d="m9 14 3 3 5-6M9 2l10 1q3 0 3 3l-1 11"/></svg><span>Courses</span></button>

  <div id="viewport" aria-label="Modelo 3D de la lección" hidden></div>
  <aside id="lesson-card" hidden aria-label="Lección seleccionada">
    <div class="lesson-caption"><span id="lesson-number"></span><span id="lesson-state"></span></div>
    <h2 id="lesson-title"></h2>
    <p id="lesson-description"></p>
    <button id="lesson-action" class="primary-action">Start</button>
  </aside>
  <div id="loading" role="status">Preparando el curso…</div>
