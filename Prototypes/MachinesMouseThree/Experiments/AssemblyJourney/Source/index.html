<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080d13"><title>Rosenblatt</title><link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
<script type="importmap">{"imports":{"three":"../../../node_modules/three/build/three.module.js","three/addons/":"../../../node_modules/three/examples/jsm/"}}</script>
</head><body>
<main id="journey">
  <div id="viewport" aria-label="Three-dimensional assembly study"></div>
  <header><button id="brand" aria-label="Return to the opening">Rosenblatt<span>ASSEMBLY STUDIES</span></button><button id="paths" hidden>Paths <span aria-hidden="true">↗</span></button></header>
  <div id="track" aria-hidden="true"><span></span></div>
  <section id="caption" aria-labelledby="title"><p id="chapter"></p><h1 id="title"></h1><p id="description"></p></section>
  <button id="recall" aria-label="Read this explanation again" hidden>Read again</button>
  <div id="scene-labels" aria-hidden="true"></div>
  <button id="return-camera" hidden>Return to journey <span aria-hidden="true">↗</span></button>
  <div id="branch-root" hidden><span>Quarks + gluons <b>→ nuclei</b></span><span>+ electrons <b>→ atoms</b></span><i>Materials & chemistry</i></div>
  <section id="route-list" aria-label="Construction paths" hidden>
    <button data-route="electronics"><span>01</span><b>Electronics</b><small>Materials → devices → circuits</small><i>Try a circuit ↗</i></button>
    <button data-route="biology"><span>02</span><b>Living systems</b><small>Chemistry → membranes → cells</small><i>In development</i></button>
    <button data-route="mechanisms"><span>03</span><b>Mechanisms</b><small>Materials → motion → machines</small><i>In development</i></button>
    <button data-route="computing"><span>04</span><b>Computing & AI</b><small>Circuits + algorithms + data</small><i>In development</i></button>
  </section>
  <footer>
    <div id="focus-tools" hidden aria-label="Explore circuit components"><button data-focus="battery">Power</button><button data-focus="resistor">Limit</button><button data-focus="led">Light</button><button data-focus="switch">Contact</button></div>
    <div id="assembly" hidden><div class="assembly-label"><label for="scrub">Assembly preview</label><output id="preview-value" for="scrub">0%</output></div><input id="scrub" type="range" min="0" max="100" value="0" step="1" aria-label="Assembly preview percentage"></div>
    <p id="reading" role="status" hidden></p>
    <button id="primary"></button><button id="hint" aria-label="Read the explanation for this scene"></button>
  </footer>
  <dialog id="details" aria-labelledby="details-title"><button id="details-close" aria-label="Close explanation">×</button><p class="overline">ROSENBLATT · STUDY 01</p><h2 id="details-title"></h2><div id="details-copy"></div><button id="details-action" hidden></button></dialog>
  <p id="announcement" role="status" class="sr-only"></p>
  <div id="failure" role="alert" hidden><h1>The 3D view could not open.</h1><p>Reopen Rosenblatt to try again.</p></div>
</main><script type="module" src="./main.js"></script></body></html>
